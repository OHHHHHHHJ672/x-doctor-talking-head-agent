name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: python -m py_compile server/extract_workflow.py

  windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Windows launcher encoding
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @("scripts/start.ps1", "scripts/doctor.ps1")) {
            $bytes = [IO.File]::ReadAllBytes($script)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
              throw "$script must use UTF-8 with BOM for Windows PowerShell 5.1"
            }
            [scriptblock]::Create((Get-Content -Raw $script)) | Out-Null
          }
          foreach ($batch in @("start.bat", "doctor.bat")) {
            $bytes = [IO.File]::ReadAllBytes($batch)
            $lf = ($bytes | Where-Object { $_ -eq 10 }).Count
            $crlf = 0
            for ($i = 1; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i - 1] -eq 13 -and $bytes[$i] -eq 10) { $crlf++ }
            }
            if ($lf -eq 0 -or $lf -ne $crlf) { throw "$batch must use CRLF line endings" }
          }
